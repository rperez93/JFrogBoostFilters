[lint:js] $PWD/tests/integration/components/auth/login-form-throttle-test.gjs
[lint:js]   70:3  error  Do not call `settled()` right after a test helper that already calls it internally  ember/no-settled-after-test-helper
[lint:js]
[lint:js] ✖ 1 problem (1 error, 0 warnings)
[lint:js]   1 error and 0 warnings potentially fixable with the `--fix` option.
[lint:js] npm run lint:js exited with code 1"""
expected = """[lint:css] 169:8 ✖ Expected "context" media feature range notation  media-feature-range-notation
[lint:css] 213:25 ✖ Expected modern color-function notation  color-function-notation
[lint:format] [warn] tests/unit/utils/live-stats-metrics-test.js
[lint:format] [warn] Code style issues found in 9 files. Run Prettier with --write to fix.
[lint:format] npm run lint:format exited with code 1
[lint:js] $PWD/tests/integration/components/auth/login-form-throttle-test.gjs
