[[tests.lint-row-padding]]
name = "a double space inside a message is not a column gap and stays"
expect_match_output = true
input = """[lint:css]    12:3   ✖  Expected "a  b" to be "a b"                                   declaration-value-spacing"""
expected = """[lint:css] 12:3 ✖ Expected "a  b" to be "a b"  declaration-value-spacing"""
