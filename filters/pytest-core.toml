schema_version = 1
# Replacement for the builtin `pytest` filter (v2), disabled with
# `boost filters disable toml:builtin:pytest` (stored as the bare name "pytest"
# in ~/.boost/config.toml — which is why this file is NOT named `pytest`: the
# same entry would disable it too). A global filter with a builtin's name does
# not shadow it — both run — so the fix has to be a separate filter.
#
# Boost ORs match_command with match_output_select, so — exactly like the
# builtin — any output carrying a pytest summary/FAILED row is selected
# whatever the command. The `::` carve-out below is what protects per-test rows
# under that wide selection; it does not depend on the command.
#
# The builtin's only retrieve regressions (history 23528, 37901; both agents
# retrieved with `--query PASSED`) came from one rule: `\[\s*\d+%\]$` is meant
# for the per-FILE progress line (`tests/test_app.py ..F.. [ 50%]`) but also
# deletes every per-TEST line that `-v` prints (`tests/x.py::test_a PASSED
# [  5%]`). 23528 lost 17/17 PASSED rows; 37901 lost 29 PASSED and 18 per-test
# FAILED/ERROR rows — the detail `-v | grep PASSED` explicitly asked for.
#
# Changes vs builtin v2, everything else identical:
#   1. the `[ NN%]` strip is carved out for per-test lines (`::` node id), so
#      `-v` / `-vv` keep their per-test result rows;
#   2. `collapse_lines_matching` for `-rA` PASSED rows is dropped: that flag
#      asks for the itemized list, and the synthesized "{count} passed" line is
#      not real pytest output (1 recorded event carried such rows);
#   3. the `^FAILED ` / `^ERROR ` selectors are anchored on pytest node ids
#      (`FAILED path::test`, `ERROR path[::test] - …`): the builtin's bare form
#      also selected unittest's `FAILED (errors=1)` summary and then peeled
#      its 70-char `====` rules into shorter fake rules (77 of 1,065 recorded
#      builtin events had non-pytest lines rewritten);
#   4. the banner peel requires a spaced title (`=== title ===`), so a bare
#      `======` rule — in captured stdout, a docstring, a unittest block — is
#      never rewritten;
#   5. match_command is the same strict, whole-command RE2 regex as
#      pytest-traceback-dedupe v2 (setup segments, then a pytest runner —
#      `pytest`, `.venv/bin/pytest`, `python -m pytest`, `uv run pytest` —
#      optionally piped to tail/head/tee/cat). The builtin's `^pytest` missed
#      the repo-local forms; heredoc and compound runs are still reached
#      through the pytest-shaped output selectors above.
[filters.pytest-core]
description = "Builtin pytest v2 minus its blind spots: drop preamble, per-file progress and titled banner chrome; keep per-test -v rows, -rA rows, bare rules, failures, tracebacks, summary."
version = "1"
match_command = '^\s*(?:(?:cd|pushd|export|source|\.|[A-Za-z_][A-Za-z0-9_]*=)(?:[^|;&\n]|>&)*(?:;|&&|\n)\s*)*(?:(?:[A-Za-z_][A-Za-z0-9_]*=[^\s|;&]*|timeout(?:(?:[ \t]|\\\n)+-[^\s|;&]+)*(?:[ \t]|\\\n)+[0-9][^\s|;&]*|env(?:(?:[ \t]|\\\n)+-u(?:[ \t]|\\\n)+[A-Za-z_][A-Za-z0-9_]*|(?:[ \t]|\\\n)+-[^\s|;&u][^\s|;&]*)*)(?:[ \t]|\\\n)+)*(?:(?:[^\s|;&]*/)?python3?(?:\.\d+)?(?:(?:[ \t]|\\\n)+-[^\s|;&m][^\s|;&]*(?:(?:[ \t]|\\\n)+[^\s|;&-][^\s|;&]*)?)*(?:[ \t]|\\\n)+-m(?:[ \t]|\\\n)+pytest|(?:uv|poetry|pipenv|pdm|hatch)(?:[ \t]|\\\n)+run(?:[ \t]|\\\n)+(?:(?:[^\s|;&]*/)?python3?(?:[ \t]|\\\n)+-m(?:[ \t]|\\\n)+)?pytest|(?:[^\s|;&]*/)?pytest)(?:(?:[ \t]|\\\n)+(?:[^\s|;&]+|[0-9]?>&[0-9]))*(?:[ \t]*\|[ \t]*(?:tail|head|tee|cat)(?:(?:[ \t]|\\\n)+(?:[^\s|;&]+|[0-9]?>&[0-9]))*)*[ \t]*\n?$'
match_output_select = [
  'test session starts',
  '(?m)^FAILED \S+::',
  '(?m)^ERROR \S+(?:::\S*)?(?: - |$)',
  '(?m)^=+ .*\b\d+ (passed|failed|error|skipped|xfailed|xpassed)\b.*=+$',
  '(?m)^=+ no tests ran',
]
strip_ansi = true
strip_lines_matching = [
  'test session starts',
  '^platform ',
  '^rootdir:',
  '^plugins:',
  '^cachedir:',
  '^configfile:',
  '^collected \d+ item',
]
strip_lines = [
  { pattern = '\[\s*\d+%\]$', unless = '::' },
]

# Peel `==== title ====` / `____ title ____` banner chrome; titles and counts
# remain. A bare rule with no spaced title is left as it is.
[[filters.pytest-core.replace]]
pattern = '^=+ (.+?) =+$'
replacement = "$1"

[[filters.pytest-core.replace]]
pattern = '^_+ (.+?) _+$'
replacement = "$1"

[[tests.pytest-core]]
name = "-v per-test rows survive; only preamble and banner chrome go (history 23528, retrieved with --query PASSED)"
expect_match_output = true
