schema_version = 1
# Drop the passing `ok N <Browser> <ver> - [N ms] - <test name>` TAP rows that
# ember-qunit / testem prints for every green test in a FULL run.
#
# Why this exists: no Boost filter covers testem TAP. `npm test` for an
# Ember + vite app is picked up by the builtin npm/vite/go/node-test filters,
# none of which touch these rows (node-test only knows `ok N -` without a
# launcher). Measured over 30 days of recorded Claude + Codex stdout: 2,484
# testem runs, 48.4 MB, 4% saved; passing rows were 31.5 MB of it. A full run
# is ~2,230 rows / ~250 KB whose only content beyond `# pass 2230` is the list
# of green names.
#
# Selection is by COMMAND ONLY. Before Boost v0.13.20 `match_command` ORed with
# `match_output_select` (jfrog/boost#84), so an output fingerprint would also
# have fired on `cat run.log` / `grep "^(ok|# tests)" run.log` and stripped rows
# an agent asked for. match_mode = "all" now allows a fingerprint as a gate, but
# none is needed: the strip rule is already the TAP row shape, and a footer gate
# would only skip aborted runs (see below). match_command is RE2 (no lookahead —
# a `(?!` pattern never matches; Boost v0.13.20+ reports it at validation,
# jfrog/boost#83), so it is written positively and anchored over the WHOLE
# command:
#   * optional setup segments only: `cd`, `pushd`, `export`, `source`, `VAR=…`
#     joined by `;` / `&&` / newline;
#   * then the suite runner itself: `npm test`, `npm run test[:x]`,
#     `[npx|path/]ember test`, `testem ci` (with `VAR=…` / `timeout N` heads);
#   * every argument token must not start with `-f` / `-m` / `--fi…` / `--mo…`,
#     so `--filter` / `--module` (scoped runs, whose ok rows prove which tests
#     ran) never match;
#   * only `| tail` / `| head` / `| tee` / `| cat` may follow — any grep, rg,
#     awk, sed, cut, redirect-then-grep, or a second command fails the match.
# Validated with RE2 on 30 days of recorded commands: 177 matches, 0 carrying a
# --filter or a line selector; 0 of them were aborted runs (ok rows without the
# `# tests N` footer), so no footer gate is needed.
#
# KEPT, always: every `not ok` row and its `---` … `...` YAML block (actual,
# expected, stack, message, browser log), `ok … # skip` / `# todo` rows,
# `1..N`, `# tests/pass/skip/todo/fail`, console `{"type":"error"…}` lines, the
# vite/embroider build lines and every warning.
#
# Also: byte-identical repeats of console `{"type":"warn",…}` lines are
# dropped after their FIRST copy (engine `dedupe_lines_matching`). Measured:
# one Ember "Binding style attributes may introduce cross-site scripting"
# warning accounts for 14,743 lines / ~5 MB; the first copy still states it.
[filters.testem-tap-passes]
description = "Drop passing `ok N <Browser> - [N ms] -` rows from full, unpiped ember/testem runs; keep not ok blocks, skip/todo, summary, errors; first copy of repeated console warns."
version = "1"
match_command = '^\s*(?:(?:cd|pushd|export|source|\.|[A-Za-z_][A-Za-z0-9_]*=)(?:[^|;&\n]|>&)*(?:;|&&|\n)\s*)*(?:(?:[A-Za-z_][A-Za-z0-9_]*=[^\s|;&]*|timeout(?:(?:[ \t]|\\\n)+-[^\s|;&]+)*(?:[ \t]|\\\n)+[0-9][^\s|;&]*|env(?:(?:[ \t]|\\\n)+-u(?:[ \t]|\\\n)+[A-Za-z_][A-Za-z0-9_]*|(?:[ \t]|\\\n)+-[^\s|;&u][^\s|;&]*)*)(?:[ \t]|\\\n)+)*(?:npx(?:[ \t]|\\\n)+|[^\s|;&]*/)?(?:npm(?:[ \t]|\\\n)+(?:run(?:[ \t]|\\\n)+)?test(?::[^\s|;&]+)?|ember(?:[ \t]|\\\n)+test|testem(?:[ \t]|\\\n)+ci)(?:(?:[ \t]|\\\n)+(?:[^\s|;&-][^\s|;&]*|-[^\s|;&fm-][^\s|;&]*|--[^\s|;&fm][^\s|;&]*|--f[^\s|;&i][^\s|;&]*|--m[^\s|;&o][^\s|;&]*|[0-9]?>&[0-9]))*(?:[ \t]*\|[ \t]*(?:tail|head|tee|cat)(?:(?:[ \t]|\\\n)+(?:[^\s|;&]+|[0-9]?>&[0-9]))*)*[ \t]*\n?$'
strip_ansi = true
strip_lines = [
  { pattern = '^ok \d+ [A-Za-z][\w ]*? \d+(?:\.\d+)* - \[\d+ ms\] - ', unless = '#\s*(?:skip|todo)\b' },
]
dedupe_lines_matching = [
  '^\s*\{"type":"warn","text":".{40,}\}\s*$',
]

